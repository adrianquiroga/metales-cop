name: Actualización Diaria Automática de Metales

on:
  schedule:
    # Corre de lunes a viernes a las 23:00 UTC (6:00 PM hora Colombia / GMT-5)
    - cron: '0 23 * * 1-5'
  workflow_dispatch: # Permite probarlo manualmente desde GitHub en cualquier momento con 1 clic

jobs:
  actualizar-metales:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Descargar el código del repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python en el servidor de GitHub
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instalar la librería openpyxl
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      # 4. Ejecutar el script actualizar_metales.py
      - name: Ejecutar script de actualización
        run: |
          python actualizar_metales.py

      # 5. Guardar los cambios automáticamente en GitHub
      - name: Guardar y subir cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Precios_Metales_COP.xlsx data.js data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática diaria [GitHub Actions]" && git push)
